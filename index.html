<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMBOK Guide Edition 8 - 项目管理指南 (第8版)</title>
<style>
/* PMBOK Edition 8 - CSS Variables */
:root {
    --pmi-blue: #005A9D;
    --pmi-dark: #003366;
    --pmi-light: #0077C8;
    --pmi-gold: #D4AF37;
    --pmi-green: #10b981;
    --pmi-bg: #F0F8FF;
    --white: #fff;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;
    --text-primary: #1f2937;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --border: #e5e7eb;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 2px 10px rgba(0, 90, 157, 0.15);
    --shadow-lg: 0 8px 25px rgba(0, 0, 0, 0.12);
    --transition: all 0.25s ease;
}

/* PMBOK Edition 8 - Main Layout Styles */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, var(--pmi-bg) 0%, #E6F2FF 100%);
    min-height: 100vh;
}

/* Header */
.header {
    background: linear-gradient(135deg, var(--pmi-dark), var(--pmi-blue));
    color: var(--white);
    padding: 12px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo { display: flex; align-items: center; gap: 12px; }

.logo-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--pmi-gold), #FFD700);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
}

.logo h1 { font-size: 18px; }
.logo-sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }

.edition-badge {
    background: linear-gradient(135deg, var(--pmi-green), #059669);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 8px;
}

/* Account Menu */
.account-menu { position: relative; }
.account-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px; cursor: pointer;
    color: var(--white); font-size: 13px;
    transition: var(--transition);
}
.account-btn:hover { background: rgba(255,255,255,0.25); }
.account-icon { font-size: 16px; }
.account-arrow { font-size: 10px; opacity: 0.8; }

.account-dropdown {
    position: absolute; top: 100%; right: 0;
    background: var(--white); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); min-width: 240px;
    padding: 8px; display: none; z-index: 1000; margin-top: 8px;
}
.account-dropdown.show { display: block; }

.dropdown-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: var(--radius);
    cursor: pointer; font-size: 13px; color: #333;
    transition: var(--transition);
}
.dropdown-item:hover { background: #f5f5f5; }
.item-icon { font-size: 16px; }
.item-text { flex: 1; }
.item-badge {
    background: linear-gradient(135deg, var(--pmi-gold), #FFD700);
    color: #333; padding: 2px 8px;
    border-radius: 10px; font-size: 10px; font-weight: 600;
}
.item-tag {
    padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 600;
}
.item-tag.premium {
    background: linear-gradient(135deg, var(--pmi-gold), #FFD700);
    color: #333;
}
.dropdown-divider { height: 1px; background: #eee; margin: 6px 0; }

/* Main Container */
.main-container {
    max-width: 1550px; margin: 0 auto; padding: 20px;
    display: grid; grid-template-columns: 420px 1fr;
    gap: 20px; align-items: start;
}

/* Sidebar */
.sidebar {
    background: var(--white); border-radius: 10px;
    box-shadow: var(--shadow); overflow: hidden;
    display: flex; flex-direction: column;
    height: calc(100vh - 95px);
}

.sidebar-header {
    background: var(--pmi-blue); color: var(--white);
    padding: 14px 18px; font-weight: 600; font-size: 14px;
    flex-shrink: 0;
}

.sidebar-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

/* View Tabs */
.view-tabs {
    display: flex; border-bottom: 1px solid #eee; flex-shrink: 0;
}
.view-tab {
    flex: 1 1 25%; padding: 12px 8px;
    text-align: center; cursor: pointer;
    background: #f5f5f5; border: none;
    font-size: 14px; font-weight: 600; color: #666;
    transition: var(--transition); line-height: 1.4;
}
.tab-en { display: block; font-size: 10px; font-weight: normal; opacity: 0.8; margin-top: 2px; }
.view-tab.active { background: var(--pmi-blue); color: var(--white); }
.view-tab.active .tab-en { opacity: 0.9; }
.view-tab:hover:not(.active) { background: #e8e8e8; }

/* Content List */
.content-list { flex: 1; overflow-y: auto; min-height: 0; }

.content-item {
    padding: 14px 18px; cursor: pointer;
    border-left: 3px solid transparent;
    border-bottom: 1px solid #f0f0f0;
    transition: var(--transition);
    display: flex; align-items: flex-start;
}
.content-item:hover {
    background: var(--pmi-bg);
    border-left-color: var(--pmi-light);
}
.content-item.active {
    background: linear-gradient(90deg, rgba(0,90,157,0.15), transparent);
    border-left-color: var(--pmi-blue);
}

.content-number {
    display: inline-block; width: 28px; height: 28px;
    background: var(--pmi-blue); color: var(--white);
    border-radius: 6px; text-align: center;
    line-height: 28px; font-size: 13px;
    margin-right: 10px; font-weight: 600; flex-shrink: 0;
}
.content-item.active .content-number { background: var(--pmi-gold); }

.content-title-cn { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
.content-title-en { font-size: 11px; opacity: 0.7; font-weight: normal; }
.content-desc { font-size: 11px; color: #666; margin-top: 4px; }

/* Content Area */
.content-area { display: flex; flex-direction: column; gap: 15px; }

/* Overview Section */
.overview-section {
    background: var(--white); border-radius: 10px;
    padding: 25px; box-shadow: var(--shadow);
}
.overview-title { font-size: 18px; font-weight: 600; color: var(--pmi-dark); margin-bottom: 10px; }
.overview-sub { font-size: 13px; opacity: 0.7; margin-bottom: 20px; }

/* Domain Map */
.domain-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
.domain-map.processes-map { grid-template-columns: repeat(5, 1fr); }
.domain-map.agile-map { grid-template-columns: repeat(4, 1fr); }

.domain-card {
    background: linear-gradient(135deg, var(--pmi-bg), #E6F2FF);
    border: 2px solid var(--pmi-light); border-radius: 10px;
    padding: 18px; text-align: center; cursor: pointer;
    transition: var(--transition);
}
.domain-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,90,157,0.2);
}
.domain-card.active {
    background: linear-gradient(135deg, var(--pmi-blue), var(--pmi-light));
    color: var(--white); border-color: var(--pmi-gold);
}

.domain-icon { font-size: 32px; margin-bottom: 10px; }
.domain-name-cn { font-weight: 600; font-size: 14px; margin-bottom: 5px; }
.domain-name-en { font-size: 11px; opacity: 0.8; }

/* Process card compact */
.domain-card.process-card { padding: 12px 8px; }
.domain-card.process-card .domain-icon { font-size: 24px; margin-bottom: 6px; }
.domain-card.process-card .domain-name-cn { font-size: 12px; }

/* Detail Section */
.detail-section {
    background: var(--white); border-radius: 10px;
    box-shadow: var(--shadow); overflow: hidden; min-height: 500px;
}

.detail-header {
    background: linear-gradient(135deg, var(--pmi-blue), var(--pmi-light));
    color: var(--white); padding: 25px;
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 20px;
}
.detail-header h2 { font-size: 22px; margin-bottom: 8px; }
.detail-number {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 3px 10px; border-radius: 4px;
    font-size: 12px; margin-right: 10px;
}
.detail-meta { font-size: 13px; opacity: 0.9; margin-top: 5px; }
.detail-header-actions { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }

.detail-header-btn {
    background: linear-gradient(135deg, var(--pmi-gold), #B8941F);
    color: #333; border: 2px solid #FFD700;
    padding: 9px 16px; border-radius: var(--radius);
    cursor: pointer; font-size: 13px; font-weight: 600;
    transition: var(--transition); white-space: nowrap;
    box-shadow: 0 2px 8px rgba(212,175,55,0.3);
}
.detail-header-btn:hover {
    background: linear-gradient(135deg, #FFD700, var(--pmi-gold));
    border-color: #FFF; transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(212,175,55,0.5);
}
.detail-header-btn.secondary {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: var(--white);
    box-shadow: none;
}
.detail-header-btn.secondary:hover {
    background: rgba(255,255,255,0.25);
}

.detail-body { padding: 25px; }

/* Principle Card */
.principle-card {
    background: var(--pmi-bg);
    border-left: 4px solid var(--pmi-blue);
    padding: 20px; border-radius: 0 8px 8px 0;
    margin-bottom: 25px;
}
.principle-card h4 {
    font-size: 15px; color: var(--pmi-dark);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
}
.principle-card p { font-size: 14px; color: #555; line-height: 1.8; margin-bottom: 10px; }
.principle-card p.en { font-size: 13px; color: #888; font-style: italic; }

/* Simple Explain */
.simple-explain {
    background: linear-gradient(90deg, rgba(212,175,55,0.15), transparent);
    border-left: 3px solid var(--pmi-gold);
    padding: 15px 18px; border-radius: 0 6px 6px 0;
    font-size: 14px; color: #8B6914; margin-top: 15px;
}
.simple-explain strong { color: #B8860B; }

/* Key Aspects */
.key-aspects { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }

.aspect-item {
    background: #f9f9f9; border: 1px solid #e0e0e0;
    border-radius: var(--radius); padding: 15px;
}
.aspect-icon { font-size: 24px; margin-bottom: 8px; }
.aspect-title { font-weight: 600; color: var(--pmi-dark); margin-bottom: 5px; font-size: 13px; }
.aspect-desc { font-size: 12px; color: #666; line-height: 1.6; }

/* Welcome State */
.welcome-state { text-align: center; padding: 60px 20px; }
.welcome-icon { font-size: 80px; margin-bottom: 20px; }
.welcome-title { font-size: 26px; color: var(--pmi-dark); margin-bottom: 15px; }
.welcome-desc { font-size: 15px; color: #666; line-height: 2; max-width: 700px; margin: 0 auto; }

.welcome-features {
    display: flex; justify-content: center;
    gap: 25px; margin-top: 40px; flex-wrap: wrap;
}
.feature-item {
    text-align: center; padding: 20px;
    background: var(--pmi-bg); border-radius: 10px; min-width: 150px;
}
.feature-icon { font-size: 40px; margin-bottom: 10px; }
.feature-title { font-weight: 600; color: var(--pmi-dark); margin-bottom: 5px; }
.feature-desc { font-size: 12px; color: #888; }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 8px; }
::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 5px; }
::-webkit-scrollbar-thumb { background: var(--pmi-light); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--pmi-blue); }

/* PMBOK Edition 8 - Component Styles */

/* Modal Overlay */
.modal-overlay {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 1000;
    justify-content: center; align-items: center;
    backdrop-filter: blur(3px);
}
.modal-overlay.active { display: flex !important; }

.modal-content {
    background: var(--white); border-radius: var(--radius-lg);
    max-width: 900px; max-height: 85vh;
    overflow-y: auto; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    position: relative;
}
.modal-content.wide { max-width: 1200px; }

.modal-header {
    background: linear-gradient(135deg, var(--pmi-dark), var(--pmi-blue));
    color: var(--white); padding: 16px 24px;
    display: flex; justify-content: space-between;
    align-items: center; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.modal-header h3 { font-size: 17px; font-weight: 600; }

.modal-close {
    background: none; border: none;
    color: var(--white); font-size: 28px;
    cursor: pointer; opacity: 0.8;
    transition: opacity 0.2s;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
}
.modal-close:hover { opacity: 1; background: rgba(255,255,255,0.1); }

.modal-body { padding: 30px; }

/* Case Study Cards */
.case-card {
    background: #f8f9fa; padding: 20px;
    border-radius: var(--radius-lg); border: 1px solid #e9ecef;
    cursor: pointer; transition: var(--transition);
}
.case-card:hover { box-shadow: var(--shadow-lg); }

.case-header {
    display: flex; justify-content: space-between;
    align-items: start; margin-bottom: 12px;
}

.industry-tag {
    font-size: 11px; padding: 4px 10px;
    background: #e0e7ff; color: #3730a3;
    border-radius: 20px;
}

.tech-tag {
    font-size: 11px; padding: 4px 10px;
    background: #f3f4f6; color: #6b7280;
    border-radius: 20px;
}

.difficulty-tag {
    font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600;
}
.difficulty-tag.easy { background: #d1fae5; color: #059669; }
.difficulty-tag.medium { background: #fef3c7; color: #b45309; }
.difficulty-tag.hard { background: #fee2e2; color: #dc2626; }

/* Filter Buttons */
.filter-btn {
    padding: 8px 16px; border-radius: 20px;
    cursor: pointer; font-size: 13px; border: none;
    transition: var(--transition);
}
.filter-btn.active { background: #8b5cf6; color: white; }
.filter-btn:not(.active) { background: #f3f4f6; color: #374151; }
.filter-btn:not(.active):hover { background: #e5e7eb; }

/* Case Detail Sections */
.case-section {
    padding: 20px; border-radius: var(--radius-lg);
    border: 1px solid; margin-bottom: 15px;
}
.case-section.challenge { background: #fef2f2; border-color: #fecaca; }
.case-section.challenge h3 { color: #dc2626; }
.case-section.challenge p { color: #7f1d1d; }
.case-section.solution { background: #f0fdf4; border-color: #bbf7d0; }
.case-section.solution h3 { color: #16a34a; }
.case-section.solution p { color: #14532d; }
.case-section.result { background: #eff6ff; border-color: #bfdbfe; }
.case-section.result h3 { color: #2563eb; }
.case-section.result p { color: #1e3a8a; }

/* Premium Section */
.premium-section .sidebar-section-header { background: var(--pmi-blue); }
.premium-section .sidebar-section-header:hover { background: var(--pmi-dark); }

.premium-nav-list { display: flex; flex-direction: column; }
.premium-nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; background: #f5f9fc;
    border: none; border-bottom: 1px solid #e0e8f0;
    cursor: pointer; transition: var(--transition);
    text-align: left; width: 100%;
}
.premium-nav-item:hover { background: #e8f4fc; }
.premium-nav-icon { font-size: 20px; }
.premium-nav-text { display: flex; flex-direction: column; gap: 2px; }
.premium-nav-title { font-weight: 600; font-size: 13px; color: var(--pmi-dark); }
.premium-nav-subtitle { font-size: 11px; color: #666; }

/* Premium Features Home */
.premium-features-home {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 15px; margin: 30px auto; max-width: 900px;
}
.premium-feature-card {
    background: linear-gradient(135deg, #FFF8E7, #FFE8A3);
    border: 2px solid var(--pmi-gold); border-radius: var(--radius-lg);
    padding: 20px 15px; cursor: pointer;
    transition: var(--transition); position: relative;
}
.premium-feature-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(212,175,55,0.3);
}
.card-icon { font-size: 36px; margin-bottom: 8px; text-align: center; }
.card-badge {
    position: absolute; top: 10px; right: 10px;
    background: linear-gradient(135deg, var(--pmi-gold), #FFD700);
    color: #333; padding: 2px 8px;
    border-radius: 10px; font-size: 10px; font-weight: 600;
}
.card-title { font-weight: 600; color: #8B6914; margin-bottom: 8px; font-size: 14px; text-align: center; }
.card-desc { font-size: 11px; color: #666; line-height: 1.5; text-align: center; }

/* Focus area header in sidebar */

/* Cross-reference links */
.cross-ref-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 15px; background: #f0f7ff;
    border-radius: var(--radius); text-decoration: none;
    color: var(--pmi-blue); border: 1px solid #bfdbfe;
    transition: var(--transition);
}
.cross-ref-link:hover { background: #e0f2fe; }

/* PMBOK Edition 8 - Premium & Trial Styles */

.upgrade-banner {
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    padding: 20px; border-radius: var(--radius-lg);
    margin-top: 20px; border: 2px solid #f59e0b;
}

.upgrade-banner-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 15px;
}

.upgrade-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 15px;
}

.upgrade-item {
    background: white; padding: 10px;
    border-radius: var(--radius);
}

.upgrade-item .check { color: #059669; font-weight: 600; font-size: 13px; }
.upgrade-item .en { color: #6b7280; font-size: 11px; }

.upgrade-btn {
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    color: white; border: none;
    padding: 10px 20px; border-radius: var(--radius);
    cursor: pointer; font-weight: 600; font-size: 14px;
    width: 100%; transition: var(--transition);
}
.upgrade-btn:hover { background: linear-gradient(135deg, #7c3aed, #6d28d9); }

/* Trial lock indicator */
.trial-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 600;
}
.trial-badge.free { background: #d1fae5; color: #059669; }
.trial-badge.locked { background: #fee2e2; color: #dc2626; }

/* License key input */
.license-section {
    padding: 15px; background: #f9fafb;
    border-radius: var(--radius); border: 1px dashed #d1d5db;
    margin-top: 15px;
}

.license-input-group {
    display: flex; gap: 8px; margin-top: 10px;
}

.license-input {
    flex: 1; padding: 8px 12px;
    border: 1px solid #d1d5db; border-radius: var(--radius);
    font-size: 14px; font-family: monospace;
}
.license-input:focus { outline: none; border-color: var(--pmi-blue); }

.license-btn {
    padding: 8px 16px; border-radius: var(--radius);
    background: var(--pmi-blue); color: white;
    border: none; cursor: pointer; font-size: 13px;
    transition: var(--transition);
}
.license-btn:hover { background: var(--pmi-dark); }

.license-status {
    font-size: 12px; margin-top: 8px;
    display: flex; align-items: center; gap: 6px;
}
.license-status.active { color: #059669; }
.license-status.inactive { color: #dc2626; }
.license-status.unknown { color: #6b7280; }

/* PMBOK Edition 8 - Quiz/Exercise Styles */

.quiz-session { padding: 10px 0; }

.quiz-progress {
    display: flex; justify-content: center;
    gap: 8px; margin-bottom: 25px;
}
.quiz-progress-item {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #e5e7eb;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    color: #6b7280;
    transition: var(--transition);
}
.quiz-progress-item.current {
    background: var(--pmi-blue); color: white;
    transform: scale(1.15);
}
.quiz-progress-item.correct {
    background: var(--success); color: white;
}
.quiz-progress-item.incorrect {
    background: var(--danger); color: white;
}

.quiz-question-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 15px;
}
.quiz-question-number { font-size: 12px; color: #6b7280; }

.quiz-difficulty-tag {
    padding: 3px 10px; border-radius: 4px;
    font-size: 11px; font-weight: 600;
}

.quiz-question {
    font-size: 16px; font-weight: 600;
    color: var(--pmi-dark); margin-bottom: 24px;
    line-height: 1.7;
}

.quiz-options { display: flex; flex-direction: column; gap: 10px; }

.quiz-option {
    padding: 14px 18px;
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: var(--radius);
    cursor: pointer; font-size: 14px;
    text-align: left; transition: var(--transition);
    color: var(--text-primary);
    width: 100%;
}
.quiz-option:hover:not(.selected):not(.disabled) {
    border-color: var(--pmi-light);
    background: var(--pmi-bg);
}
.quiz-option.selected { border-color: var(--pmi-blue); background: #eff6ff; }
.quiz-option.correct {

/**
 * PMBOK Edition 8 - 状态管理模块
 * State Management Module
 */
const state = {
    currentUser: null,
    isPremiumUser: false,
    licenseKey: null,
    licenseDeviceId: null,
    licenseExpiresAt: null,
    currentView: 'principles',
    selectedPrinciple: null,
    selectedDomain: null,
    selectedProcess: null,
    selectedAgile: null,
    quizScores: {}
};

const STORAGE_KEYS = {
    PREMIUM: 'pmbok8_premium',
    PREMIUM_EXPIRY: 'pmbok8_premium_expiry',
    LICENSE_KEY: 'pmbok8_license_key',
    DEVICE_ID: 'pmbok8_device_id',
    QUIZ_SCORES: 'pmbok8_quiz_scores',
    USER: 'pmbok8_user'
};

function getFromStorage(key) {
    try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : null;
    } catch (e) {
        console.warn('Storage read error:', e);
        return null;
    }
}

function setToStorage(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
    } catch (e) {
        console.warn('Storage write error:', e);
        return false;
    }
}

function loadState() {
    const premium = getFromStorage(STORAGE_KEYS.PREMIUM);
    const premiumExpiry = getFromStorage(STORAGE_KEYS.PREMIUM_EXPIRY);
    const licenseKey = getFromStorage(STORAGE_KEYS.LICENSE_KEY);
    const deviceId = getFromStorage(STORAGE_KEYS.DEVICE_ID);
    const quizScores = getFromStorage(STORAGE_KEYS.QUIZ_SCORES);
    const user = getFromStorage(STORAGE_KEYS.USER);

    let isPremium = false;
    if (premium && premiumExpiry) {
        isPremium = new Date(premiumExpiry) > new Date();
    }
    if (premium === 'forever') isPremium = true;

    state.isPremiumUser = isPremium;
    state.licenseKey = licenseKey;
    state.licenseDeviceId = deviceId;
    state.quizScores = quizScores || {};
    state.currentUser = user;
    return state;
}

function saveState() {
    setToStorage(STORAGE_KEYS.PREMIUM, state.isPremiumUser);
    if (state.licenseExpiresAt) setToStorage(STORAGE_KEYS.PREMIUM_EXPIRY, state.licenseExpiresAt);
    if (state.licenseKey) setToStorage(STORAGE_KEYS.LICENSE_KEY, state.licenseKey);
    if (state.licenseDeviceId) setToStorage(STORAGE_KEYS.DEVICE_ID, state.licenseDeviceId);
    if (state.quizScores) setToStorage(STORAGE_KEYS.QUIZ_SCORES, state.quizScores);
    if (state.currentUser) setToStorage(STORAGE_KEYS.USER, state.currentUser);
}

function getDeviceId() {
    let deviceId = getFromStorage(STORAGE_KEYS.DEVICE_ID);
    if (!deviceId) {
        const fp = [navigator.userAgent, navigator.language, screen.colorDepth, screen.width, screen.height, new Date().getTimezoneOffset(), Date.now()].join('|');
        let hash = 0;
        for (let i = 0; i < fp.length; i++) {
            const c = fp.charCodeAt(i);
            hash = ((hash << 5) - hash) + c;
            hash |= 0;
        }
        deviceId = 'DEV' + Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
        setToStorage(STORAGE_KEYS.DEVICE_ID, deviceId);
    }
    return deviceId;
}

/**

const TRIAL_PRINCIPLES = [1, 2, 3, 4, 5, 6]; // 6 原则全部免费基础访问
const TRIAL_DOMAINS = [1, 2, 3, 4, 5, 6, 7]; // 7 绩效域全部免费基础访问
const TRIAL_QUIZZES_PER_ITEM = 3; // 每项前3题免费
const TRIAL_CASE_STUDIES = 4; // 前4个案例免费

function checkTrialAccess(type, number) {
    const trialLimits = {
        principle: { allowed: TRIAL_PRINCIPLES, name: '原则' },
        domain: { allowed: TRIAL_DOMAINS, name: '绩效域' }
    };
    const config = trialLimits[type];
    if (!config) return { isTrial: false, canAccess: true, message: '' };
    if (config.allowed.includes(number)) {
        return { isTrial: true, canAccess: true, message: '✅ 免费内容' };
    }
    return { isTrial: true, canAccess: false, message: `🔒 ${config.name} #${number} 需要 Premium` };
}

function canAccessContent(isPremium, type, number) {
    if (isPremium) return true;
    if (type === 'principle') return TRIAL_PRINCIPLES.includes(number);
    if (type === 'domain') return TRIAL_DOMAINS.includes(number);
    return true;
}

/**
 * PMBOK Edition 8 - 弹窗管理模块
 * Modal Management: 案例弹窗、自测弹窗、案例库弹窗
 */
let currentQuizzes = [];

function setCurrentQuizzes(quizzes) { currentQuizzes = quizzes || []; }
function getCurrentQuizzes() { return currentQuizzes; }

// ============ 案例弹窗 ============
function _showCaseModalItem(item) {
    const modal = document.getElementById('caseModal');
    const content = document.getElementById('caseModalContent');
    if (!modal || !content) return;

    if (!item || !item.example) {
        content.innerHTML = '<p style="padding:20px;text-align:center;">暂无案例数据 | No case data available</p>';
    } else {
        content.innerHTML = `
            <h3 style="color:var(--pmi-blue);margin-bottom:15px;">📝 ${item.example.title}</h3>
            <div style="background:#f5f9fc;padding:15px;border-radius:8px;border-left:4px solid var(--pmi-blue);margin-bottom:15px;">
                <strong>场景 | Scenario:</strong><br>
                <span style="color:#555;line-height:1.8;">${item.example.scenario}</span>
            </div>
            <div style="margin-bottom:15px;">
                <strong>采取的行动 | Actions Taken:</strong>
                <ul style="margin-top:8px;padding-left:20px;line-height:2;">
                    ${item.example.actions.map(a => `<li>${a}</li>`).join('')}
                </ul>
            </div>
            <div style="background:#f0fdf4;padding:15px;border-radius:8px;border-left:4px solid #10b981;">
                <strong style="color:#059669;">结果 | Outcome:</strong><br>
                <span style="color:#555;line-height:1.8;">${item.example.outcome}</span>
            </div>
        `;
    }
    modal.style.display = 'flex';
}

// ============ 自测弹窗 ============
function _showQuizModalFn(item, quizzes) {
    const modal = document.getElementById('quizModal');
    const content = document.getElementById('quizModalContent');
    const title = document.getElementById('quizModalTitle');
    if (!modal || !content) return;

    if (!quizzes || quizzes.length === 0) {
        if (title) title.textContent = '自测 | Self-test';
        content.innerHTML = '<p style="padding:20px;text-align:center;">暂无题目 | No quiz available</p>';
        modal.style.display = 'flex';
        return;
    }

    setCurrentQuizzes(quizzes);
    if (title) {
        const label = item.name || item.title || '';
        title.textContent = `自测：${label} | ${quizzes.length}道题`;
    }

    content.innerHTML = `
        <div class="quiz-session">
            <div class="quiz-progress">${quizzes.map((_, i) => `
                <div class="quiz-progress-item${i === 0 ? ' current' : ''}" data-qi="${i}">${i + 1}</div>
            `).join('')}</div>
            <div id="quizQContainer"></div>
        </div>
    `;

    renderQuizQuestion(0, quizzes);
    modal.style.display = 'flex';
}

function renderQuizQuestion(index, quizzes) {
    const container = document.getElementById('quizQContainer');
    const quiz = quizzes[index];
    if (!container || !quiz) return;

    container.innerHTML = `
        <div class="quiz-question-header">
            <span class="quiz-question-number">第 ${index + 1}/${quizzes.length} 题</span>
            ${quiz.difficulty ? `<span class="quiz-difficulty-tag" style="background:${getDiffBg(quiz.difficulty)};color:${getDiffColor(quiz.difficulty)}">${getDiffText(quiz.difficulty)}</span>` : ''}
        </div>
        <div class="quiz-question">${quiz.question}</div>
        <div class="quiz-options">
            ${quiz.options.map((opt, i) => `
                <button class="quiz-option" onclick="window.handleQuizAnswer(${index}, ${i}, ${quiz.correct})" data-oi="${i}">${opt}</button>
            `).join('')}
        </div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <div class="quiz-navigation">
            <button class="quiz-nav-btn" onclick="window.navigateQuiz(${index - 1})" ${index === 0 ? 'disabled' : ''}>← 上一题</button>
            <button class="quiz-nav-btn" onclick="window.navigateQuiz(${index + 1})" ${index === quizzes.length - 1 ? 'disabled' : ''}>下一题 →</button>
        </div>
    `;

    updateProgressDots(index, quizzes.length);
}

function updateProgressDots(current, total) {
    document.querySelectorAll('.quiz-progress-item').forEach((dot, i) => {
        dot.classList.remove('current', 'correct', 'incorrect');
        if (i < current && !dot.classList.contains('correct') && !dot.classList.contains('incorrect')) {
            // 未答题保持默认
        }
        if (i === current) dot.classList.add('current');
    });
}

window.handleQuizAnswer = (index, selected, correct) => {
    const container = document.getElementById('quizQContainer');
    if (!container) return;
    const options = container.querySelectorAll('.quiz-option');
    const feedback = document.getElementById('quizFeedback');
    const quiz = getCurrentQuizzes()[index];

    options.forEach(o => o.classList.add('disabled'));
    options[correct].classList.add('correct');
    if (selected !== correct) options[selected].classList.add('incorrect');

    const isCorrect = selected === correct;
    feedback.className = 'quiz-feedback show ' + (isCorrect ? 'correct-fb' : 'incorrect-fb');
    feedback.innerHTML = `
        <div style="font-weight:600;margin-bottom:6px;">${isCorrect ? '✅ 正确！' : '❌ 错误。正确答案是 ' + ['A','B','C','D'][correct]}</div>
        <div>${quiz.explanation}</div>
    `;

    const dot = document.querySelector(`.quiz-progress-item[data-qi="${index}"]`);
    if (dot) { dot.classList.remove('current'); dot.classList.add(isCorrect ? 'correct' : 'incorrect'); dot.textContent = isCorrect ? '✓' : '✗'; }
};

window.navigateQuiz = (index) => {
    const quizzes = getCurrentQuizzes();
    if (index >= 0 && index < quizzes.length) renderQuizQuestion(index, quizzes);
};

function getDiffBg(d) { return { easy: '#d1fae5', medium: '#fef3c7', hard: '#fee2e2' }[d] || '#e5e7eb'; }
function getDiffColor(d) { return { easy: '#059669', medium: '#b45309', hard: '#dc2626' }[d] || '#6b7280'; }
function getDiffText(d) { return { easy: '简单', medium: '中等', hard: '困难' }[d] || '未知'; }

}
function closeQuizModal() {

}

}

        if (e.target.id === 'quizModal') closeQuizModal();

    });

    });
}

            <div class="principle-card"><h4>📘 流程说明 | Description</h4><p>${p.description}</p><p class="en">${p.descriptionEn}</p></div>
            <h4 style="color:var(--pmi-dark);margin:20px 0 15px">📋 输入、工具与输出 | ITTO</h4>
            <div class="key-aspects" style="grid-template-columns:1fr 1fr 1fr">
                <div class="aspect-item"><div class="aspect-icon">📥</div><div class="aspect-title">输入 | Inputs</div><ul style="padding-left:15px;font-size:12px;line-height:1.8;margin-top:8px">${p.inputs.map(i => `<li>${i}</li>`).join('')}</ul></div>
                <div class="aspect-item"><div class="aspect-icon">🔧</div><div class="aspect-title">工具 | Tools</div><ul style="padding-left:15px;font-size:12px;line-height:1.8;margin-top:8px">${p.tools.map(t => `<li>${t}</li>`).join('')}</ul></div>
                <div class="aspect-item"><div class="aspect-icon">📤</div><div class="aspect-title">输出 | Outputs</div><ul style="padding-left:15px;font-size:12px;line-height:1.8;margin-top:8px">${p.outputs.map(o => `<li>${o}</li>`).join('')}</ul></div>
            </div>
        </div>`;
    renderSidebar();
}

// ==================== 选择敏捷 ====================
function selectAgile(index) {
    selectedAgile = index; selectedPrinciple = null; selectedDomain = null; selectedProcess = null;
    const a = agileApproaches[index];
    if (!a) return;
    const ds = document.getElementById('detailSection');
    document.getElementById('overviewSection').style.display = 'none';
    ds.style.display = 'block';

    let content = '';
    if (a.values) {
        content = `<h4 style="color:var(--pmi-dark);margin:20px 0 15px">📘 四项价值 | Four Values</h4>
            <div class="key-aspects" style="grid-template-columns:1fr 1fr">
                <div class="aspect-item"><div class="aspect-icon">💚</div><div class="aspect-title">核心价值</div>
                    <ul style="padding-left:15px;font-size:12px;line-height:2.2;margin-top:8px;list-style:none">${a.values.map(v => `<li><strong>${v.title}</strong> ${v.description}<br><span style="color:#666;font-size:11px"><em>${v.titleEn}</em> ${v.descriptionEn}</span></li>`).join('')}</ul></div>
                <div class="aspect-item"><div class="aspect-icon">📋</div><div class="aspect-title">十二原则 | 12 Principles</div>
                    <ul style="padding-left:15px;font-size:12px;line-height:2;margin-top:8px;list-style:none">${a.principles.map((pr,i) => `<li>${['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟','1️⃣1️⃣','1️⃣2️⃣'][i]} ${pr}</li>`).join('')}</ul></div></div>`;
    } else if (a.roles) {
        content = `<h4 style="color:var(--pmi-dark);margin:20px 0 15px">👥 三个角色 | Three Roles</h4>
            <div class="key-aspects" style="grid-template-columns:1fr 1fr 1fr">${a.roles.map(r => `<div class="aspect-item" style="text-align:center"><div class="aspect-icon" style="font-size:32px">${r.icon}</div><div class="aspect-title">${r.name}</div><div style="font-size:12px;color:#666;margin-top:5px">${r.nameZh}</div><div style="font-size:11px;color:#999;margin-top:3px">${r.responsibility}</div></div>`).join('')}</div>
            <h4 style="color:var(--pmi-dark);margin:20px 0 15px">📅 四个仪式 | Four Events</h4>
            <div class="key-aspects" style="grid-template-columns:1fr 1fr 1fr 1fr">${a.events.map(e => `<div class="aspect-item"><div class="aspect-title">${e.name}</div><div style="font-size:11px;color:#666;margin-top:5px">${e.nameZh}</div><div style="font-size:10px;color:#999;margin-top:3px">${e.duration}</div><div style="font-size:10px;color:#999;margin-top:2px">${e.purpose}</div></div>`).join('')}</div>
            <h4 style="color:var(--pmi-dark);margin:20px 0 15px">📦 三个工件 | Three Artifacts</h4>
            <div class="key-aspects" style="grid-template-columns:1fr 1fr 1fr">${a.artifacts.map(ar => `<div class="aspect-item"><div class="aspect-title">${ar.name}</div><div style="font-size:11px;color:#666;margin-top:5px">${ar.nameZh}</div><div style="font-size:10px;color:#999;margin-top:3px">${ar.description}</div></div>`).join('')}</div>`;
    } else if (a.practices) {
        content = `<h4 style="color:var(--pmi-dark);margin:20px 0 15px">🎯 六大核心实践 | 6 Core Practices</h4>
            <div class="key-aspects" style="grid-template-columns:1fr 1fr 1fr">${a.practices.map(pr => `<div class="aspect-item"><div class="aspect-icon">${pr.icon}</div><div class="aspect-title">${pr.name}</div><div style="font-size:11px;color:#666;margin-top:5px">${pr.nameEn}</div><div style="font-size:11px;color:#999;margin-top:3px">${pr.description}</div></div>`).join('')}</div>`;
    } else if (a.models) {
        content = `<h4 style="color:var(--pmi-dark);margin:20px 0 15px">💡 常见混合模式 | Common Hybrid Models</h4>
            <div style="display:grid;gap:15px;margin-bottom:20px">${a.models.map(m => `<div class="principle-card" style="margin:0"><h4>${m.name}</h4><div style="font-size:12px;color:#666;margin-bottom:8px">${m.nameEn}</div><div style="font-size:13px;color:#555;line-height:1.6">${m.description}</div></div>`).join('')}</div>
            <h4 style="color:var(--pmi-dark);margin:20px 0 15px">✅ 何时选择混合方法 | When to Choose Hybrid</h4>
            <div class="key-aspects" style="grid-template-columns:1fr 1fr">${a.whenToUse.map(w => `<div class="aspect-item"><div class="aspect-icon">✅</div><div class="aspect-title">${w.split('|')[0]}</div><div style="font-size:12px;color:#666;margin-top:5px">${w.split('|')[1]||''}</div></div>`).join('')}</div>`;

    ds.innerHTML = `

        <div class="detail-body">${content}</div>`;
    renderSidebar();
}

// ==================== 案例弹窗桥接 ====================
window.showCaseModal = (num) => { const p = principles.find(x => x.number === num); if (p) _showCaseModalItem(p); };
window.showDomainCaseModal = (num) => { const d = performanceDomains.find(x => x.number === num); if (d) _showCaseModalItem(d); };
window.showQuizModalForItem = (num) => { const p = principles.find(x => x.number === num); if (p?.quizzes) _showQuizModalFn(p, p.quizzes); };
window.showDomainQuizModal = (num) => { const d = performanceDomains.find(x => x.number === num); if (d?.quiz) _showQuizModalFn(d, [d.quiz]); };
window.showProcessQuizModal = () => { alert('流程自测题目开发中... | Process quizzes coming soon'); };

// ==================== 案例库弹窗 ====================
function openCaseLibrary() {
    const modal = document.getElementById('caseOverlay');
    const body = document.getElementById('caseOverlayBody');
    if (!modal || !body) return;

    const byIndustry = caseStudies.reduce((acc, c) => { if (!acc[c.industry]) acc[c.industry] = []; acc[c.industry].push(c); return acc; }, {});

    body.innerHTML = `
        <div style="margin-bottom:25px"><p style="font-size:14px;color:#666;line-height:1.8">真实项目案例库，涵盖12个案例，跨多个行业的敏捷/混合/预测型项目实践。</p></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px" id="filterBar">
            <button class="filter-btn active" onclick="renderAllCases()">全部 (12)</button>
            ${Object.keys(byIndustry).map(ind => `<button class="filter-btn" onclick="filterCases('${ind}')">${ind}</button>`).join('')}
        </div>
        <div id="caseList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px">${renderCaseCards(caseStudies)}</div>
    `;
    modal.style.display = 'flex';
}

function renderCaseCards(cases) {
    return cases.map(c => `
        <div class="case-card" onclick="viewCaseDetail(${c.id})">
            <div class="case-header"><h4 style="color:#1f2937;font-size:15px;margin:0">${c.title}</h4><span class="difficulty-tag ${c.difficulty==='简单'?'easy':c.difficulty==='中等'?'medium':'hard'}">${c.difficulty}</span></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
                <span class="industry-tag">🏢 ${c.industry}</span>
                ${c.tags.slice(0,3).map(t => `<span class="tech-tag">${t}</span>`).join('')}
            </div>
            <p style="font-size:13px;color:#6b7280;line-height:1.6;margin:0">${c.challenge}</p>
            <div style="margin-top:12px;text-align:right"><span style="font-size:12px;color:#8b5cf6">点击查看详情 →</span></div>
        </div>
    `).join('');
}

window.renderAllCases = () => {
    document.querySelectorAll('#filterBar .filter-btn').forEach(b => { b.classList.remove('active'); if (b.textContent.startsWith('全部')) b.classList.add('active'); });
    document.getElementById('caseList').innerHTML = renderCaseCards(caseStudies);
};

window.filterCases = (industry) => {
    document.querySelectorAll('#filterBar .filter-btn').forEach(b => { b.classList.toggle('active', b.textContent === industry); });
    document.getElementById('caseList').innerHTML = renderCaseCards(caseStudies.filter(c => c.industry === industry));
};

window.viewCaseDetail = (id) => {
    const c = caseStudies.find(x => x.id === id);
    const body = document.getElementById('caseOverlayBody');
    body.innerHTML = `
        <button onclick="openCaseLibrary()" style="margin-bottom:20px;padding:8px 16px;background:#f3f4f6;color:#374151;border:none;border-radius:8px;cursor:pointer;font-size:13px">← 返回列表</button>
        <div style="background:linear-gradient(135deg,#f0fdf4,#ecfdf5);padding:25px;border-radius:12px;margin-bottom:20px">
            <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:15px">
                <h2 style="color:#059669;font-size:20px;margin:0">${c.title}</h2>
                <span class="difficulty-tag ${c.difficulty==='简单'?'easy':c.difficulty==='中等'?'medium':'hard'}" style="font-size:12px;padding:6px 12px">难度：${c.difficulty}</span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
                <span style="font-size:12px;padding:6px 12px;background:white;color:#374151;border-radius:20px;border:1px solid #e5e7eb">🏢 ${c.industry}</span>
                ${c.tags.map(t => `<span style="font-size:12px;padding:6px 12px;background:white;color:#6b7280;border-radius:20px;border:1px solid #e5e7eb">${t}</span>`).join('')}
            </div>
        </div>
        <div style="display:grid;gap:20px">
            <div class="case-section challenge"><h3 style="font-size:15px;margin-bottom:10px">🔴 挑战 | Challenge</h3><p style="line-height:1.8;font-size:14px">${c.challenge}</p></div>
            <div class="case-section solution"><h3 style="font-size:15px;margin-bottom:10px">🟢 解决方案 | Solution</h3><p style="line-height:1.8;font-size:14px">${c.solution}</p></div>
            <div class="case-section result"><h3 style="font-size:15px;margin-bottom:10px">🔵 成果 | Results</h3><p style="line-height:1.8;font-size:14px">${c.result}</p></div>
        </div>
    `;
};

window.closeCaseLibrary = () => { const m = document.getElementById('caseOverlay'); if (m) m.style.display = 'none'; };

// ==================== 导航桥接 ====================
function switchToDomain(number) { switchView('domains'); setTimeout(() => selectDomain(number), 50); }
function switchToPrinciple(number) { switchView('principles'); setTimeout(() => selectPrinciple(number), 50); }
window.switchToDomain = switchToDomain;
window.switchToPrinciple = switchToPrinciple;

// ==================== 账户/Premium ====================
function updateAccountUI() {
    const btn = document.getElementById('accountBtn');
    if (!btn) return;
    if (state.isPremiumUser) {
        btn.innerHTML = '<span class="account-icon">👑</span><span class="account-text">Premium</span><span class="account-arrow">▼</span>';
        const dd = document.getElementById('accountDropdown');
        if (dd) dd.innerHTML = `<div class="dropdown-item"><span class="item-icon">👑</span><span class="item-text">Premium 会员</span><span class="item-badge">已激活</span></div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item" onclick="alert('功能开发中...')"><span class="item-icon">📊</span><span class="item-text">学习进度</span></div>
            <div class="dropdown-item" onclick="alert('功能开发中...')"><span class="item-icon">⭐</span><span class="item-text">收藏内容</span></div>`;
    } else {
        btn.innerHTML = '<span class="account-icon">👤</span><span class="account-text">免费用户</span><span class="account-arrow">▼</span>';
        const dd = document.getElementById('accountDropdown');
        if (dd) dd.innerHTML = `<div class="dropdown-item" onclick="openPremiumModal()"><span class="item-icon">👑</span><span class="item-text">升级 Premium</span><span class="item-tag premium">推荐</span></div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item"><span class="item-icon">📘</span><span class="item-text">6 项原则（免费）</span></div>
            <div class="dropdown-item"><span class="item-icon">🌐</span><span class="item-text">7 个绩效域（免费）</span></div>
            <div class="dropdown-item"><span class="item-icon">🔄</span><span class="item-text">40 个流程（免费）</span></div>
            <div class="dropdown-item"><span class="item-icon">🚀</span><span class="item-text">敏捷方法（免费）</span></div>`;
    }
}

window.openPremiumModal = () => {
    // 简单创建 premium 弹窗
    let modal = document.getElementById('premiumModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'premiumModal';
        modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-content"><div class="modal-header" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed)"><h3>👑 升级 Premium</h3><button class="modal-close" onclick="closePremiumModal()">×</button></div><div class="modal-body" id="premiumBody"></div></div>`;
        document.body.appendChild(modal);
        modal.addEventListener('click', e => { if (e.target === modal) closePremiumModal(); });
    }
    document.getElementById('premiumBody').innerHTML = getTrialUpgradeMessage();
    modal.style.display = 'flex';
};
window.closePremiumModal = () => { const m = document.getElementById('premiumModal'); if (m) m.style.display = 'none'; };

window.activateLicense = () => {
    const input = document.getElementById('licenseKeyInput');
    const status = document.getElementById('licenseStatus');
    const key = input?.value?.trim();
    if (!key) { if (status) { status.textContent = '请输入 License Key'; status.className = 'license-status inactive'; } return; }
    // TODO: 接入 Supabase 验证 License
    if (key.length >= 8) {
        state.isPremiumUser = true;
        state.licenseKey = key;
        setToStorage(STORAGE_KEYS.PREMIUM, true);
        setToStorage(STORAGE_KEYS.LICENSE_KEY, key);
        if (status) { status.textContent = '✅ License 激活成功！'; status.className = 'license-status active'; }
        updateAccountUI();
        setTimeout(() => closePremiumModal(), 1000);
    } else {
        if (status) { status.textContent = '❌ License Key 无效'; status.className = 'license-status inactive'; }
    }
};

// ==================== 启动 ====================
document.addEventListener('DOMContentLoaded', initApp);

</script>
